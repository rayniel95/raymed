specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: DrugExposure
    network: sepolia
    source:
      address: "0xF136b7a0D1369011897bB4bD7f1A81CfC883369A"
      abi: DrugExposure
      startBlock: 7676602
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NftCreated
        - NftUpdated
      abis:
        - name: DrugExposure
          file: ./abis/DrugExposure.json
      eventHandlers:
        - event: NftCreated(indexed uint256,string)
          handler: handleNftMint
        - event: NftUpdated(indexed uint256,string)
          handler: handleNftMetadataUpdate
      file: ./src/drug-exposure.ts
  - kind: ethereum
    name: Note
    network: sepolia
    source:
      address: "0x3b66a8147fFc81A1026cdCD6A9798b8b972a51c9"
      abi: DrugExposure
      startBlock: 7676603
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NftCreated
        - NftUpdated
      abis:
        - name: DrugExposure
          file: ./abis/DrugExposure.json
      eventHandlers:
        - event: NftCreated(indexed uint256,string)
          handler: handleNftMint
        - event: NftUpdated(indexed uint256,string)
          handler: handleNftMetadataUpdate
      file: ./src/note.ts
